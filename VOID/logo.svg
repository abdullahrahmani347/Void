<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern VOID Logo -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E3001B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF3D00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Stylized V / Portal Icon -->
  <path d="M10 10 L30 50 L50 10" fill="none" stroke="url(#logoGradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="30" cy="25" r="5" fill="#E3001B">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Text "VOID" -->
  <text x="65" y="45" font-family="'Bebas Neue', sans-serif" font-size="42" font-weight="bold" fill="white" letter-spacing="4">VOID</text>
  <circle cx="185" cy="40" r="4" fill="#E3001B" />
</svg>
