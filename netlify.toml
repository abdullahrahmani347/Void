[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# SPA fallback (functions are matched before redirects)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# S-07: header-based security policy. The <meta http-equiv> CSP cannot express
# frame-ancestors and is weaker than a header policy; this header completes it.
# Keep in sync with the CSP constant in dev-server.js.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; frame-src https://www.youtube.com https://www.vidking.net; img-src 'self' data: https://image.tmdb.org; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.themoviedb.org https://image.tmdb.org; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
